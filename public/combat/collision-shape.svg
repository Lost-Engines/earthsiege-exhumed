<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 395" role="img" aria-labelledby="title desc"><title id="title">Octagonal approximation used by projectile hit tests</title><desc id="desc">The original lateral norm is maximum absolute coordinate plus half the minimum. Its constant-radius boundary is octagonal; a circle is shown for comparison.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10Z" fill="#82c9bd"/></marker></defs><rect width="800" height="395" fill="#101b25"/><g font-family="system-ui,sans-serif"><text x="28" y="34" fill="#ebca80" font-size="23" text-anchor="start">A cheap cross-section for a hit test</text><circle cx="205" cy="205" r="130" fill="none" stroke="#a9bbc5" stroke-dasharray="4 5"/><polygon points="335,205 291.6666666666667,291.6666666666667 205,335 118.33333333333333,291.6666666666667 75,205 118.33333333333333,118.33333333333333 205,75 291.6666666666667,118.33333333333333" fill="#82c9bd" fill-opacity=".1" stroke="#82c9bd" stroke-width="3"/><path d="M55,205 L355,205" fill="none" stroke="#a9bbc5" stroke-width="2"/><path d="M205,55 L205,355" fill="none" stroke="#a9bbc5" stroke-width="2"/><text x="362" y="211" fill="#a9bbc5" font-size="16" text-anchor="start">X</text><text x="213" y="53" fill="#a9bbc5" font-size="16" text-anchor="start">Z</text><text x="395" y="115" fill="#edf0e7" font-size="16" text-anchor="start">Lateral distance estimate:</text><text x="395" y="150" fill="#edf0e7" font-size="16" text-anchor="start">max(|X|, |Z|) + min(|X|, |Z|) / 2</text><text x="395" y="205" fill="#82c9bd" font-size="16" text-anchor="start">Teal: original test boundary</text><text x="395" y="238" fill="#edf0e7" font-size="16" text-anchor="start">Dotted: a circle of the same radius</text><text x="395" y="291" fill="#edf0e7" font-size="16" text-anchor="start">No square root is needed.</text><text x="395" y="324" fill="#edf0e7" font-size="16" text-anchor="start">Depth is approximated linearly too.</text></g></svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 530" role="img" aria-labelledby="title desc"><title id="title">Samson leg attachment chain and shared actuator</title><desc id="desc">Upper leg carries lower leg, which carries foot. All three protect the same left leg actuator. A destroyed foot can disable the machine without detaching its upper leg.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10Z" fill="#82c9bd"/></marker></defs><rect width="800" height="530" fill="#101b25"/><g font-family="system-ui,sans-serif"><text x="28" y="34" fill="#ebca80" font-size="23" text-anchor="start">Three sections, one leg actuator</text><text x="28" y="63" fill="#a9bbc5" font-size="16" text-anchor="start">Samson left leg: original section and component links</text><rect x="35" y="95" width="245" height="80" rx="5" fill="#1b2a35" stroke="#82c9bd"/><text x="49" y="124" fill="#82c9bd" font-size="18" text-anchor="start">Upper leg · section 7</text><text x="49" y="149" fill="#a9bbc5" font-size="15" text-anchor="start">Armour 4,000</text><path d="M280,135 L515,260" fill="none" stroke="#ebca80" stroke-width="2" stroke-dasharray="6 5"/><rect x="35" y="220" width="245" height="80" rx="5" fill="#1b2a35" stroke="#82c9bd"/><text x="49" y="249" fill="#82c9bd" font-size="18" text-anchor="start">Lower leg · section 9</text><text x="49" y="274" fill="#a9bbc5" font-size="15" text-anchor="start">Armour 3,750</text><path d="M280,260 L515,260" fill="none" stroke="#ebca80" stroke-width="2" stroke-dasharray="6 5"/><rect x="35" y="345" width="245" height="80" rx="5" fill="#1b2a35" stroke="#82c9bd"/><text x="49" y="374" fill="#82c9bd" font-size="18" text-anchor="start">Foot · section 11</text><text x="49" y="399" fill="#a9bbc5" font-size="15" text-anchor="start">Armour 2,500</text><path d="M280,385 L515,260" fill="none" stroke="#ebca80" stroke-width="2" stroke-dasharray="6 5"/><path d="M155,175 L155,215" fill="none" stroke="#82c9bd" stroke-width="2" marker-end="url(#arrow)"/><path d="M155,300 L155,340" fill="none" stroke="#82c9bd" stroke-width="2" marker-end="url(#arrow)"/><rect x="520" y="220" width="240" height="80" rx="5" fill="#1b2a35" stroke="#ebca80"/><text x="534" y="249" fill="#ebca80" font-size="18" text-anchor="start">Left leg actuator · 0</text><text x="534" y="274" fill="#a9bbc5" font-size="15" text-anchor="start">Capacity 2,500</text><text x="35" y="473" fill="#82c9bd" font-size="16" text-anchor="start">Solid arrows: removal travels down the attachment chain.</text><text x="35" y="503" fill="#ebca80" font-size="16" text-anchor="start">Dashed links: armour overflow can damage the same internal component.</text></g></svg>

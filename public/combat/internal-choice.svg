<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 375" role="img" aria-labelledby="title desc"><title id="title">Weighted selection for front cockpit overflow</title><desc id="desc">Weights 30, 40 and 10 become probabilities 37.5%, 50% and 12.5% when all three components are alive. The pilot has only 50 capacity.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10Z" fill="#82c9bd"/></marker></defs><rect width="800" height="375" fill="#101b25"/><g font-family="system-ui,sans-serif"><text x="28" y="34" fill="#ebca80" font-size="23" text-anchor="start">Where does cockpit armour overflow go?</text><rect x="28" y="65" width="744" height="70" rx="5" fill="#1b2a35" stroke="#82c9bd"/><text x="42" y="94" fill="#82c9bd" font-size="18" text-anchor="start">Front cockpit armour · 4,500 points</text><text x="42" y="119" fill="#a9bbc5" font-size="15" text-anchor="start">The remaining damage enters one weighted choice among live internals.</text><rect x="28" y="180" width="279.0" height="48" fill="#82c9bd"/><text x="167.5" y="210" fill="#101b25" font-size="20" text-anchor="middle">37.5%</text><rect x="307.0" y="180" width="372.0" height="48" fill="#ebca80"/><text x="493.0" y="210" fill="#101b25" font-size="20" text-anchor="middle">50.0%</text><rect x="679.0" y="180" width="93.0" height="48" fill="#ef9779"/><text x="725.5" y="210" fill="#101b25" font-size="20" text-anchor="middle">12.5%</text><text x="28" y="268" fill="#edf0e7" font-size="18" text-anchor="start">Sensor array</text><text x="28" y="296" fill="#a9bbc5" font-size="16" text-anchor="start">Weight 30; capacity 700</text><text x="283" y="268" fill="#edf0e7" font-size="18" text-anchor="start">Gyroscope</text><text x="283" y="296" fill="#a9bbc5" font-size="16" text-anchor="start">Weight 40; capacity 700</text><text x="538" y="268" fill="#edf0e7" font-size="18" text-anchor="start">Pilot</text><text x="538" y="296" fill="#a9bbc5" font-size="16" text-anchor="start">Weight 10; capacity 50</text><text x="28" y="345" fill="#a9bbc5" font-size="16" text-anchor="start">When a component dies, remove its weight and choose again if damage remains.</text></g></svg>

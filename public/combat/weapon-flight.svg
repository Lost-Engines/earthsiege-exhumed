<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 435" role="img" aria-labelledby="title desc"><title id="title">Original ballistic path of a detached weapon</title><desc id="desc">Horizontal speed decays each update; gravity lowers vertical speed. Ground contact reverses and damps vertical speed until the object is retired.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10Z" fill="#82c9bd"/></marker></defs><rect width="800" height="435" fill="#101b25"/><g font-family="system-ui,sans-serif"><text x="28" y="34" fill="#ebca80" font-size="23" text-anchor="start">A weapon becomes a moving object</text><text x="28" y="62" fill="#a9bbc5" font-size="16" text-anchor="start">One original ejection and its complete debris trajectory</text><path d="M65,335 L755,335" fill="none" stroke="#a9bbc5" stroke-width="2"/><text x="65" y="360" fill="#a9bbc5" font-size="14" text-anchor="start">Release</text><text x="755" y="360" fill="#a9bbc5" font-size="14" text-anchor="end">Retired after bouncing</text><polyline fill="none" stroke="#82c9bd" stroke-width="2" points="65.0,129.5 106.1,117.2 145.1,107.6 182.3,100.7 217.5,96.5 251.1,95.0 283.1,96.2 313.5,100.1 342.5,106.6 370.0,115.9 396.2,127.9 421.1,142.6 444.8,159.9 467.4,180.0 488.9,202.8 509.3,228.2 528.8,256.4 547.3,287.2 564.9,320.8 581.7,335.0 597.7,321.8 612.8,311.3 627.2,303.4 641.0,298.3 654.2,295.9 666.7,296.2 678.7,299.1 690.0,304.8 700.7,313.2 710.9,324.2 720.7,335.0 730.0,331.7 738.8,331.0 747.1,333.1 755.0,335.0"/><circle cx="65.0" cy="129.5" r="3" fill="#ebca80"/><circle cx="106.1" cy="117.2" r="3" fill="#ebca80"/><circle cx="145.1" cy="107.6" r="3" fill="#ebca80"/><circle cx="182.3" cy="100.7" r="3" fill="#ebca80"/><circle cx="217.5" cy="96.5" r="3" fill="#ebca80"/><circle cx="251.1" cy="95.0" r="3" fill="#ebca80"/><circle cx="283.1" cy="96.2" r="3" fill="#ebca80"/><circle cx="313.5" cy="100.1" r="3" fill="#ebca80
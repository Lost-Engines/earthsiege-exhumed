<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 395" role="img" aria-labelledby="title desc"><title id="title">Six stages from collision to combat consequences</title><desc id="desc">A hit crosses the shield volume, tests shield charge, spends armour, chooses internal components, removes linked sections and updates consequences.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10Z" fill="#82c9bd"/></marker></defs><rect width="800" height="395" fill="#101b25"/><g font-family="system-ui,sans-serif"><text x="28" y="35" fill="#ebca80" font-size="23" text-anchor="start">Following a hit</text><rect x="25" y="70" width="210" height="82" rx="5" fill="#1b2a35" stroke="#82c9bd"/><text x="39" y="99" fill="#82c9bd" font-size="18" text-anchor="start">1. Hit geometry</text><text x="39" y="124" fill="#a9bbc5" font-size="15" text-anchor="start">Ray through shield volume</text><rect x="295" y="70" width="210" height="82" rx="5" fill="#1b2a35" stroke="#82c9bd"/><text x="309" y="99" fill="#82c9bd" font-size="18" text-anchor="start">2. Shield charge</text><text x="309" y="124" fill="#a9bbc5" font-size="15" text-anchor="start">Any shield damage left?</text><rect x="565" y="70" width="210" height="82" rx="5" fill="#1b2a35" stroke="#82c9bd"/><text x="579" y="99" fill="#82c9bd" font-size="18" text-anchor="start">3. Part armour</text><text x="579" y="124" fill="#a9bbc5" font-size="15" text-anchor="start">Spend the armour field</text><rect x="565" y="230" width="210" height="82" rx="5" fill="#1b2a35" stroke="#82c9bd"/><text x="579" y="259" fill="#82c9bd" font-size="18" text-anchor="start">4. Internals</text><text x="579" y="284" fill="#a9bbc5" font-size="15" text-anchor="start">Choose by live weights</text><rect x="295" y="230" width="210" height="82" rx="5" fill="#1b2a35" stroke="#82c9bd"/><text x="309" y="259" fill="#82c9bd" font-size="18" text-anchor="start">5. Attachments</text><text x="309" y="284" fill="#a9bbc5" font-size="15" text-anchor="start">Remove child sections</text><rect x="25" y="230" width="210" height="82" rx="5" fill="#1b2a35" stroke="#82c9bd"/><text x="39" y="259" fill="#82c9bd" font-size="18" text-anchor="start">6. Consequences</text><text x="39" y="284" fill="#a9bbc5" font-size="15" text-anchor="start">Weapons, motion, salvage</text><path d="M235,111 L290,111" fill="none" stroke="#82c9bd" stroke-width="2" marker-end="url(#arrow)"/><path d="M505,111 L560,111" fill="none" stroke="#82c9bd" stroke-width="2" marker-end="url(#arrow)"/><path d="M565,271 L510,271" fill="none" stroke="#82c9bd" stroke-width="2" marker-end="url(#arrow)"/><path d="M295,271 L240,271" fill="none" stroke="#82c9bd" stroke-width="2" marker-end="url(#arrow)"/><path d="M670,152 L670,225" fill="none" stroke="#82c9bd" stroke-width="2" marker-end="url(#arrow)"/><text x="28" y="365" fill="#a9bbc5" font-size="16" text-anchor="start">Armour damage is a separate packet field; shield exhaustion gates access to it.</text></g></svg>

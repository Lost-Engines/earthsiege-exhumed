<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-labelledby="title desc"><title id="title">Perspective projection using similar triangles</title><desc id="desc">A vertex at height Z and depth Y projects to height f times Z divided by Y on a plane f units from the eye. The usual near plane is at that same depth.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#7cc3b6"/></marker></defs><rect width="800" height="450" rx="4" fill="#101b24"/><g font-family="system-ui,sans-serif" font-size="18" fill="#d9e5e8"><text x="30" y="35" fill="#edcb81" font-size="23" text-anchor="start">Perspective, seen from the side</text><text x="30" y="62" fill="#9fb5bd" font-size="18" text-anchor="start">Y points forward; Z points up.</text><path d="M90,280 L745,280" fill="none" stroke="#7cc3b6" stroke-width="2" marker-end="url(#arrow)"/><text x="715" y="306" fill="#d9e5e8" font-size="18" text-anchor="start">Y</text><path d="M90,280 L90,95" fill="none" stroke="#7cc3b6" stroke-width="2" marker-end="url(#arrow)"/><text x="62" y="106" fill="#d9e5e8" font-size="18" text-anchor="start">Z</text><path d="M270,100 L270,330" fill="none" stroke="#edcb81" stroke-width="2"/><text x="270" y="365" fill="#edcb81" font-size="17" text-anchor="middle">screen / near plane</text><path d="M90,280 L660,100" fill="none" stroke="#7cc3b6" stroke-width="2"/><path d="M660,100 L660,280" fill="none" stroke="#9fb5bd" stroke-width="2" stroke-dasharray="7 6"/><path d="M90,280 L660,280" fill="none" stroke="#9fb5bd" stroke-width="2"/><circle cx="660" cy="100" r="6" fill="#edcb81"/><circle cx="270" cy="223.16" r="5" fill="#7cc3b6"/><circle cx="90" cy="280" r="6" fill="#7cc3b6"/><text x="676" y="96" fill="#edcb81" font-size="18" text-anchor="start">(Y, Z)</text><text x="44" y="325" fill="#d9e5e8" font-size="18" text-anchor="start">eye</text><text x="300" y="248" fill="#7cc3b6" font-size="18" text-anchor="start">f × Z / Y</text><text x="160" y="306" fill="#edcb81" font-size="18" text-anchor="start">f</text><text x="438" y="306" fill="#9fb5bd" font-size="18" text-anchor="start">Y</text><text x="30" y="414" fill="#d9e5e8" font-size="20" text-anchor="start">Farther away → smaller projected displacement.</text></g></svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 435" role="img" aria-labelledby="title desc"><title id="title">The original Gouraud routine emits a band for each palette step</title><desc id="desc">Original emitted polygon boundaries over a synthetic triangle shaded with one WORLD0 colour ramp. Corner palette indices are 112, 127 and 120.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#7cc3b6"/></marker></defs><rect width="800" height="435" rx="4" fill="#101b24"/><g font-family="system-ui,sans-serif" font-size="18" fill="#d9e5e8"><text x="24" y="32" fill="#edcb81" font-size="22" text-anchor="start">One triangle becomes many flat polygons</text><g transform="translate(80,20) scale(2)"><polygon points="119,27 142,44 114,36 119,27" fill="#d7ba8e" stroke="#eadabc" stroke-opacity=".65" stroke-width=".45"/><polygon points="142,44 166,61 108,45 114,36" fill="#cbae82" stroke="#eadabc" stroke-opacity=".65" stroke-width=".45"/><polygon points="166,61 190,79 102,54 108,45" fill="#c3a275" stroke="#eadabc" stroke-opacity=".65" stroke-width=".45"/><polygon points="190,79 213,96 97,63 102,54" fill="#b6966d" stroke="#eadabc" stroke-opacity=".65" stroke-width=".45"/><polygon points="213,96 237,114 91,72 97,63" fill="#ae8a61" stroke="#eadabc" stroke-opacity=".65" stroke-width=".45"/><polygon points="237,114 261,131 85,81 91,72" fill="#a67d59" stroke="#eadabc" stroke-opacity=".65" stroke-width=".45"/><polygon points="261,131 285,149 80,90 85,81" fill="#9a7151" stroke="#eadabc" stroke-opacity=".65" stroke-width=".45"/><polygon points="285,149 254,150 74,100 80,90" fill="#926949" stroke="#eadabc" stroke-opacity=".65" stroke-width=".45"/><polygon points="254,150 223,152 68,109 74,100" fill="#865d41" stroke="#eadabc" stroke-opacity=".65" stroke-width=".45"/><polygon points="223,152 191,154 63,118 68,109" fill="#7d5538" stroke="#eadabc" stroke-opacity=".65" stroke-width=".45"/><polygon points="191,154 160,156 57,127 63,118" fill="#754930" stroke="#eadabc" stroke-opacity=".65" stroke-width=".45"/><polygon points="160,156 129,158 51,136 57,127" fill="#694128" stroke="#eadabc" stroke-opacity=".65" stroke-width=".45"/><polygon points="129,158 97,160 46,145 51,136" fill="#613824" stroke="#eadabc" stroke-opacity=".65" stroke-width=".45"/><polygon points="97,160 66,162 40,154 46,145" fill="#552c1c" stroke="#eadabc" stroke-opacity=".65" stroke-width=".45"/><polygon points="66,162 34,164 34,164 40,154" fill="#4d2818" stroke="#eadabc" stroke-opacity=".65" stroke-width=".45"/></g><text x="148" y="376" fill="#edcb81" font-size="18" text-anchor="middle">112</text><text x="318" y="62" fill="#edcb81" font-size="18" text-anchor="middle">127</text><text x="650" y="346" fill="#edcb81" font-size="18" text-anchor="middle">120</text><text x="28" y="405" fill="#9fb5bd" font-size="17" text-anchor="start">Labels are palette indices. Fine lines expose the emitted bands.</text></g></svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" role="img" aria-labelledby="title desc"><title id="title">From model coordinates to VGA memory</title><desc id="desc">Conceptual stages of the renderer. Operations are interleaved within each object in the actual code.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#7cc3b6"/></marker></defs><rect width="800" height="520" rx="4" fill="#101b24"/><g font-family="system-ui,sans-serif" font-size="18" fill="#d9e5e8"><rect x="25" y="25" width="750" height="64" rx="4" fill="#1b303a" stroke="#7cc3b6"/><text x="44" y="51" fill="#edcb81" font-size="20" text-anchor="start">1. Pose &amp; place</text><text x="44" y="75" fill="#9fb5bd" font-size="17" text-anchor="start">Local parts → world → camera</text><path d="M400,90 L400,105" fill="none" stroke="#7cc3b6" stroke-width="2" marker-end="url(#arrow)"/><rect x="25" y="107" width="750" height="64" rx="4" fill="#1b303a" stroke="#7cc3b6"/><text x="44" y="133" fill="#edcb81" font-size="20" text-anchor="start">2. Order &amp; reject</text><text x="44" y="157" fill="#9fb5bd" font-size="17" text-anchor="start">Bounds, distance, BSP, faces</text><path d="M400,172 L400,187" fill="none" stroke="#7cc3b6" stroke-width="2" marker-end="url(#arrow)"/><rect x="25" y="189" width="750" height="64" rx="4" fill="#1b303a" stroke="#7cc3b6"/><text x="44" y="215" fill="#edcb81" font-size="20" text-anchor="start">3. Light &amp; clip</text><text x="44" y="239" fill="#9fb5bd" font-size="17" text-anchor="start">Normals, palette ramps, near plane</text><path d="M400,254 L400,269" fill="none" stroke="#7cc3b6" stroke-width="2" marker-end="url(#arrow)"/><rect x="25" y="271" width="750" height="64" rx="4" fill="#1b303a" stroke="#7cc3b6"/><text x="44" y="297" fill="#edcb81" font-size="20" text-anchor="start">4. Project</text><text x="44" y="321" fill="#9fb5bd" font-size="17" text-anchor="start">3D points → integer screen positions</text><path d="M400,336 L400,351" fill="none" stroke="#7cc3b6" stroke-width="2" marker-end="url(#arrow)"/><rect x="25" y="353" width="750" height="64" rx="4" fill="#1b303a" stroke="#7cc3b6"/><text x="44" y="379" fill="#edcb81" font-size="20" text-anchor="start">5. Fill</text><text x="44" y="403" fill="#9fb5bd" font-size="17" text-anchor="start">Flat spans, bands, affine textures</text><path d="M400,418 L400,433" fill="none" stroke="#7cc3b6" stroke-width="2" marker-end="url(#arrow)"/><rect x="25" y="435" width="750" height="64" rx="4" fill="#1b303a" stroke="#7cc3b6"/><text x="44" y="461" fill="#edcb81" font-size="20" text-anchor="start">6. Present</text><text x="44" y="485" fill="#9fb5bd" font-size="17" text-anchor="start">Cockpit masks, VGA pages, palette</text></g></svg>

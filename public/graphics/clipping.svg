<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 410" role="img" aria-labelledby="title desc"><title id="title">Clipping a triangle before perspective division</title><desc id="desc">A triangle crossing the near plane is trimmed to a four-sided polygon. New edge intersections retain interpolated position, texture coordinates and light values.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#7cc3b6"/></marker></defs><rect width="800" height="410" rx="4" fill="#101b24"/><g font-family="system-ui,sans-serif" font-size="18" fill="#d9e5e8"><text x="28" y="35" fill="#edcb81" font-size="22" text-anchor="start">Near-plane clipping, seen from above</text><path d="M280,75 L280,300" stroke="#edcb81" stroke-width="2"/><polygon points="130,120 630,95 650,270" fill="#503e34" stroke="#e7987d" stroke-width="2"/><polygon points="280,112.5 630,95 650,270 280,163.27" fill="#28574e" stroke="#7cc3b6" stroke-width="2"/><circle cx="280" cy="112.5" r="6" fill="#edcb81"/><circle cx="280" cy="163.27" r="6" fill="#edcb81"/><text x="65" y="325" fill="#e7987d" font-size="18" text-anchor="start">Discarded</text><text x="415" y="325" fill="#7cc3b6" font-size="18" text-anchor="start">Kept and projected</text><text x="285" y="70" fill="#edcb81" font-size="18" text-anchor="start">near</text><text x="30" y="380" fill="#d9e5e8" font-size="20" text-anchor="start">At each crossing: interpolate position, UV and light.</text></g></svg>

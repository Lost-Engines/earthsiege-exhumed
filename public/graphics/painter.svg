<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="title desc"><title id="title">Painter ordering with a binary space partition</title><desc id="desc">In this illustrative top view, A is on the far side of a partition and B is on the eye side. Draw A, any polygons at the node, then B. Moving the eye across the partition reverses the side order.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#7cc3b6"/></marker></defs><rect width="800" height="480" rx="4" fill="#101b24"/><g font-family="system-ui,sans-serif" font-size="18" fill="#d9e5e8"><text x="28" y="35" fill="#edcb81" font-size="22" text-anchor="start">Painter order inside one authored BSP node</text><path d="M375,70 L375,280" fill="none" stroke="#edcb81" stroke-width="2" stroke-dasharray="7 6"/><text x="390" y="92" fill="#edcb81" font-size="17" text-anchor="start">splitting plane</text><rect x="110" y="140" width="90" height="60" rx="4" fill="#234b47" stroke="#7cc3b6"/><text x="155" y="178" fill="#d9e5e8" font-size="24" text-anchor="middle">A</text><rect x="500" y="170" width="90" height="60" rx="4" fill="#344252" stroke="#7cc3b6"/><text x="545" y="208" fill="#d9e5e8" font-size="24" text-anchor="middle">B</text><circle cx="710" cy="260" r="7" fill="#7cc3b6"/><text x="695" y="294" fill="#7cc3b6" font-size="18" text-anchor="middle">eye</text><path d="M695,253 L602,207" fill="none" stroke="#7cc3b6" stroke-width="2" marker-end="url(#arrow)"/><text x="375" y="319" fill="#d9e5e8" font-size="20" text-anchor="middle">draw far side → node → near side</text><rect x="310" y="351" width="130" height="45" rx="4" fill="#1b303a" stroke="#7cc3b6"/><text x="375" y="380" fill="#edcb81" font-size="20" text-anchor="middle">node</text><path d="M310,394 L235,425" fill="none" stroke="#7cc3b6" stroke-width="2" marker-end="url(#arrow)"/><path d="M440,394 L515,425" fill="none" stroke="#7cc3b6" stroke-width="2" marker-end="url(#arrow)"/><text x="235" y="452" fill="#7cc3b6" font-size="19" text-anchor="middle">A first</text><text x="515" y="452" fill="#7cc3b6" font-size="19" text-anchor="middle">B last</text></g></svg>

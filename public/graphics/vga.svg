<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 535" role="img" aria-labelledby="title desc"><title id="title">VGA planar pixel addressing</title><desc id="desc">Successive screen pixels are distributed across four VGA planes. Pixels zero, four and eight occupy consecutive byte addresses in plane zero. The stride depends on the backing surface width.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#7cc3b6"/></marker></defs><rect width="800" height="535" rx="4" fill="#101b24"/><g font-family="system-ui,sans-serif" font-size="18" fill="#d9e5e8"><text x="28" y="35" fill="#edcb81" font-size="22" text-anchor="start">Four neighbouring pixels, four memory planes</text><rect x="46" y="64" width="52" height="46" rx="4" fill="#edcb81" stroke="#101b24"/><text x="72" y="94" fill="#101b24" font-size="20" text-anchor="middle">0</text><rect x="105" y="64" width="52" height="46" rx="4" fill="#7cc3b6" stroke="#101b24"/><text x="131" y="94" fill="#101b24" font-size="20" text-anchor="middle">1</text><rect x="164" y="64" width="52" height="46" rx="4" fill="#b3a3d6" stroke="#101b24"/><text x="190" y="94" fill="#101b24" font-size="20" text-anchor="middle">2</text><rect x="223" y="64" width="52" height="46" rx="4" fill="#e7987d" stroke="#101b24"/><text x="249" y="94" fill="#101b24" font-size="20" text-anchor="middle">3</text><rect x="282" y="64" width="52" height="46" rx="4" fill="#edcb81" stroke="#101b24"/><text x="308" y="94" fill="#101b24" font-size="20" text-anchor="middle">4</text><rect x="341" y="64" width="52" height="46" rx="4" fill="#7cc3b6" stroke="#101b24"/><text x="367" y="94" fill="#101b24" font-size="20" text-anchor="middle">5</text><rect x="400" y="64" width="52" height="46" rx="4" fill="#b3a3d6" stroke="#101b24"/><text x="426" y="94" fill="#101b24" font-size="20" text-anchor="middle">6</text><rect x="459" y="64" width="52" height="46" rx="4" fill="#e7987d" stroke="#101b24"/><text x="485" y="94" fill="#101b24" font-size="20" text-anchor="middle">7</text><rect x="518" y="64" width="52" height="46" rx="4" fill="#edcb81" stroke="#101b24"/><text x="544" y="94" fill="#101b24" font-size="20" text-anchor="middle">8</text><rect x="577" y="64" width="52" height="46" rx="4" fill="#7cc3b6" stroke="#101b24"/><text x="603" y="94" fill="#101b24" font-size="20" text-anchor="middle">9</text><rect x="636" y="64" width="52" height="46" rx="4" fill="#b3a3d6" stroke="#101b24"/><text x="662" y="94" fill="#101b24" font-size="20" text-anchor="middle">10</text><rect x="695" y="64" width="52" height="46" rx="4" fill="#e7987d" stroke="#101b24"/><text x="721" y="94" fill="#101b24" font-size="20" text-anchor="middle">11</text><text x="28" y="137" fill="#9fb5bd" font-size="17" text-anchor="start">Screen x</text><text x="30" y="191" fill="#edcb81" font-size="18" text-anchor="start">Plane 0</text><rect x="150" y="163" width="166" height="36" rx="4" fill="#1b303a" stroke="#7cc3b6"/><text x="233" y="188" fill="#edcb81" font-size="18" text-anchor="middle">pixel 0</text><rect x="332" y="163" width="166" height="36" rx="4" fill="#1b303a" stroke="#7cc3b6"/><text x="415" y="188" fill="#edcb81" font-size="18" text-anchor="middle">pixel 4</text><rect x="514" y="163" width="166" height="36" rx="4" fill="#1b303a" stroke="#7cc3b6"/><text x="597" y="188" fill="#edcb81" font-size="18" text-anchor="middle">pixel 8</text><text x="30" y="242" fill="#7cc3b6" font-size="18" text-anchor="start">Plane 1</text><rect x="150" y="214" width="166" height="36" rx="4" fill="#1b303a" stroke="#7cc3b6"/><text x="233" y="239" fill="#7cc3b6" font-size="18" text-anchor="middle">pixel 1</text><rect x="332" y="214" width="166" height="36" rx="4" fill="#1b303a" stroke="#7cc3b6"/><text x="415" y="239" fill="#7cc3b6" font-size="18" text-anchor="middle">pixel 5</text><rect x="514" y="214" width="166" height="36" rx="4" fill="#1b303a" stroke="#7cc3b6"/><text x="597" y="239" fill="#7cc3b6" font-size="18" text-anchor="middle">pixel 9</text><text x="30" y="293" fill="#b3a3d6" font-size="18" text-anchor="start">Plane 2</text><rect x="150" y="265" width="166" height="36" rx="4" fill="#1b303a" stroke="#7cc3b6"/><text x="233" y="290" fill="#b3a3d6" font-size="18" text-anchor="middle">pixel 2</text><rect x="332" y="265" width="166" height="36" rx="4" fill="#1b303a" stroke="#7cc3b6"/><text x="415" y="290" fill="#b3a3d6" font-size="18" text-anchor="middle">pixel 6</text><rect x="514" y="265" width="166" height="36" rx="4" fill="#1b303a" stroke="#7cc3b6"/><text x="597" y="290" fill="#b3a3d6" font-size="18" text-anchor="middle">pixel 10</text><text x="30" y="344" fill="#e7987d" font-size="18" text-anchor="start">Plane 3</text><rect x="150" y="316" width="166" height="36" rx="4" fill="#1b303a" stroke="#7cc3b6"/><text x="233" y="341" fill="#e7987d" font-size="18" text-anchor="middle">pixel 3</text><rect x="332" y="316" width="166" height="36" rx="4" fill="#1b303a" stroke="#7cc3b6"/><text x="415" y="341" fill="#e7987d" font-size="18" text-anchor="middle">pixel 7</text><rect x="514" y="316" width="166" height="36" rx="4" fill="#1b303a" stroke="#7cc3b6"/><text x="597" y="341" fill="#e7987d" font-size="18" text-anchor="middle">pixel 11</text><text x="233" y="390" fill="#9fb5bd" font-size="17" text-anchor="middle">offset 0</text><text x="415" y="390" fill="#9fb5bd" font-size="17" text-anchor="middle">offset 1</text><text x="597" y="390" fill="#9fb5bd" font-size="17" text-anchor="middle">offset 2</text><text x="28" y="434" fill="#d9e5e8" font-size="19" text-anchor="start">plane = x &amp; 3</text><text x="250" y="434" fill="#d9e5e8" font-size="19" text-anchor="start">address = y × stride + (x &gt;&gt; 2)</text><text x="28" y="476" fill="#9fb5bd" font-size="18" text-anchor="start">320-pixel row: stride 80 bytes per plane.</text><text x="28" y="505" fill="#9fb5bd" font-size="18" text-anchor="start">640-pixel backing surface: stride 160; four 320 × 200 pages.</text></g></svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 350" role="img" aria-labelledby="title desc"><title id="title">The radar reads outside its pose array</title><desc id="desc">The two valid pose matrices are followed by allocation metadata and animation data. Invalid distant partition references use that neighbouring memory.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10Z" fill="context-stroke"/></marker></defs><rect width="800" height="350" fill="#101b25"/><g font-family="system-ui,sans-serif"><text x="30" y="40" fill="#ebca80" font-size="24" text-anchor="start">An invalid matrix index reaches the next allocation</text><rect x="35" y="100" width="210" height="95" rx="5" fill="#1b2a35" stroke="#82c9bd"/><text x="50" y="129" fill="#82c9bd" font-size="20" text-anchor="start">Pose matrix 0</text><text x="50" y="155" fill="#a9bbc5" font-size="16" text-anchor="start">Valid model transform</text><rect x="265" y="100" width="210" height="95" rx="5" fill="#1b2a35" stroke="#82c9bd"/><text x="280" y="129" fill="#82c9bd" font-size="20" text-anchor="start">Pose matrix 1</text><text x="280" y="155" fill="#a9bbc5" font-size="16" text-anchor="start">Valid model transform</text><rect x="495" y="100" width="270" height="95" rx="5" fill="#1b2a35" stroke="#ef9779"/><text x="510" y="129" fill="#ef9779" font-size="20" text-anchor="start">Neighbouring memory</text><text x="510" y="155" fill="#a9bbc5" font-size="16" text-anchor="start">ABLK header and pointer</text><path d="M495,220 L495,78" fill="none" stroke="#ef9779" stroke-width="2" stroke-dasharray="6 5"/><text x="30" y="255" fill="#a9bbc5" font-size="18" text-anchor="start">Array ends here</text><path d="M185,249 L490,220" fill="none" stroke="#a9bbc5" stroke-width="2" marker-end="url(#arrow)"/><text x="30" y="300" fill="#ef9779" font-size="23" text-anchor="start">Indices 2-4 read beyond the two valid entries.</text></g></svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 350" role="img" aria-labelledby="title desc"><title id="title">The encounter music transition</title><desc id="desc">Current-song volumes are 100,85,70,55,40,25,10,0. On the next update, the partner starts at 100.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10Z" fill="context-stroke"/></marker></defs><rect width="800" height="350" fill="#101b25"/><g font-family="system-ui,sans-serif"><text x="30" y="40" fill="#ebca80" font-size="25" text-anchor="start">A fade-out, then a fresh start</text><rect x="55" y="95.0" width="40" height="150.0" fill="#82c9bd"/><text x="75" y="275" fill="#a9bbc5" font-size="19" text-anchor="middle">0</text><text x="75" y="82" fill="#82c9bd" font-size="18" text-anchor="middle">100</text><rect x="138" y="117.5" width="40" height="127.5" fill="#82c9bd"/><text x="158" y="275" fill="#a9bbc5" font-size="19" text-anchor="middle">1</text><text x="158" y="104.5" fill="#82c9bd" font-size="18" text-anchor="middle">85</text><rect x="221" y="140.0" width="40" height="105.0" fill="#82c9bd"/><text x="241" y="275" fill="#a9bbc5" font-size="19" text-anchor="middle">2</text><text x="241" y="127" fill="#82c9bd" font-size="18" text-anchor="middle">70</text><rect x="304" y="162.5" width="40" height="82.5" fill="#82c9bd"/><text x="324" y="275" fill="#a9bbc5" font-size="19" text-anchor="middle">3</text><text x="324" y="149.5" fill="#82c9bd" font-size="18" text-anchor="middle">55</text><rect x="387" y="185.0" width="40" height="60.0" fill="#82c9bd"/><text x="407" y="275" fill="#a9bbc5" font-size="19" text-anchor="middle">4</text><text x="407" y="172" fill="#82c9bd" font-size="18" text-anchor="middle">40</text><rect x="470" y="207.5" width="40" height="37.5" fill="#82c9bd"/><text x="490" y="275" fill="#a9bbc5" font-size="19" text-anchor="middle">5</text><text x="490" y="194.5" fill="#82c9bd" font-size="18" text-anchor="middle">25</text><rect x="553" y="230.0" width="40" height="15.0" fill="#82c9bd"/><text x="573" y="275" fill="#a9bbc5" font-size="19" text-anchor="middle">6</text><text x="573" y="217" fill="#82c9bd" font-size="18" text-anchor="middle">10</text><rect x="636" y="245.0" width="40" height="2" fill="#82c9bd"/><text x="656" y="275" fill="#a9bbc5" font-size="19" text-anchor="middle">7</text><text x="656" y="232" fill="#82c9bd" font-size="18" text-anchor="middle">0</text><rect x="719" y="95.0" width="40" height="150.0" fill="#ebca80"/><text x="739" y="275" fill="#a9bbc5" font-size="19" text-anchor="middle">8</text><text x="739" y="82" fill="#ebca80" font-size="18" text-anchor="middle">100</text><text x="30" y="320" fill="#a9bbc5" font-size="19" text-anchor="start">Update number: A fades to zero; B starts at 100 on update 8.</text></g></svg>

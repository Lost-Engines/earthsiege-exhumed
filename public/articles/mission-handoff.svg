<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 570" role="img" aria-labelledby="title desc"><title id="title">The launch and return handoff</title><desc id="desc">GO compiles the mission using source, career and randomness, then DBSIM constructs and runs it and returns results.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10Z" fill="context-stroke"/></marker></defs><rect width="800" height="570" fill="#101b25"/><g font-family="system-ui,sans-serif"><text x="30" y="40" fill="#ebca80" font-size="25" text-anchor="start">From career to battlefield and back</text><rect x="30" y="80" width="230" height="75" rx="5" fill="#1b2a35" stroke="#82c9bd"/><text x="45" y="109" fill="#82c9bd" font-size="20" text-anchor="start">Mission source</text><text x="45" y="135" fill="#a9bbc5" font-size="16" text-anchor="start">Authored alternatives</text><rect x="285" y="80" width="230" height="75" rx="5" fill="#1b2a35" stroke="#82c9bd"/><text x="300" y="109" fill="#82c9bd" font-size="20" text-anchor="start">Career state</text><text x="300" y="135" fill="#a9bbc5" font-size="16" text-anchor="start">Counters and roster</text><rect x="540" y="80" width="230" height="75" rx="5" fill="#1b2a35" stroke="#82c9bd"/><text x="555" y="109" fill="#82c9bd" font-size="20" text-anchor="start">Random state</text><text x="555" y="135" fill="#a9bbc5" font-size="16" text-anchor="start">Shared shell generator</text><path d="M145,155 L400,200" fill="none" stroke="#82c9bd" stroke-width="2" marker-end="url(#arrow)"/><path d="M400,155 L400,200" fill="none" stroke="#82c9bd" stroke-width="2" marker-end="url(#arrow)"/><path d="M655,155 L400,200" fill="none" stroke="#82c9bd" stroke-width="2" marker-end="url(#arrow)"/><rect x="230" y="205" width="340" height="75" rx="5" fill="#1b2a35" stroke="#82c9bd"/><text x="245" y="234" fill="#82c9bd" font-size="20" text-anchor="start">GO: prepare the launch</text><text x="245" y="260" fill="#a9bbc5" font-size="16" text-anchor="start">Compile, then apply settings</text><path d="M400,280 L400,310" fill="none" stroke="#82c9bd" stroke-width="2" marker-end="url(#arrow)"/><rect x="80" y="315" width="640" height="75" rx="5" fill="#1b2a35" stroke="#82c9bd"/><text x="95" y="344" fill="#82c9bd" font-size="20" text-anchor="start">SCRIPT.DAT  /  MISSION.VAR  /  PLAYER.MEC</text><text x="95" y="370" fill="#a9bbc5" font-size="16" text-anchor="start">Compiled tables, counters, equipment</text><path d="M400,390 L400,420" fill="none" stroke="#82c9bd" stroke-width="2" marker-end="url(#arrow)"/><rect x="230" y="425" width="340" height="75" rx="5" fill="#1b2a35" stroke="#82c9bd"/><text x="245" y="454" fill="#82c9bd" font-size="20" text-anchor="start">DBSIM: construct and run</text><text x="245" y="480" fill="#a9bbc5" font-size="16" text-anchor="start">Groups, actors, objectives, results</text><text x="400" y="545" fill="#82c9bd" font-size="21" text-anchor="middle">RESULTS.DAT + updated counters return to GO</text></g></svg>

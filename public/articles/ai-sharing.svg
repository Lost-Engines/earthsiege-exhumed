<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 330" role="img" aria-labelledby="title desc"><title id="title">Contact-sharing range boundaries</title><desc id="desc">Below 50,000: awareness and eligible alert/trigger. Below 120,000: awareness. Waiting groups are skipped.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10Z" fill="context-stroke"/></marker></defs><rect width="800" height="330" fill="#101b25"/><g font-family="system-ui,sans-serif"><text x="30" y="40" fill="#ebca80" font-size="25" text-anchor="start">Sharing a reported enemy contact</text><text x="30" y="75" fill="#a9bbc5" font-size="18" text-anchor="start">Distance from recipient to enemy, in internal world units</text><rect x="50.0" y="120" width="250.0" height="48" fill="#82c9bd"/><text x="175" y="201" fill="#82c9bd" font-size="16" text-anchor="middle">Awareness + alert</text><rect x="300.0" y="120" width="350.0" height="48" fill="#ebca80"/><text x="475" y="201" fill="#ebca80" font-size="16" text-anchor="middle">Awareness</text><rect x="650.0" y="120" width="100.0" height="48" fill="#a9bbc5"/><text x="700" y="201" fill="#a9bbc5" font-size="16" text-anchor="middle">No new contact</text><path d="M50,168 L50,177" fill="none" stroke="#a9bbc5" stroke-width="2"/><text x="50" y="235" fill="#a9bbc5" font-size="17" text-anchor="middle">0</text><path d="M300,168 L300,177" fill="none" stroke="#a9bbc5" stroke-width="2"/><text x="300" y="235" fill="#a9bbc5" font-size="17" text-anchor="middle">50,000</text><path d="M650,168 L650,177" fill="none" stroke="#a9bbc5" stroke-width="2"/><text x="650" y="235" fill="#a9bbc5" font-size="17" text-anchor="middle">120,000</text><path d="M750,168 L750,177" fill="none" stroke="#a9bbc5" stroke-width="2"/><text x="750" y="235" fill="#a9bbc5" font-size="17" text-anchor="middle">140,000</text><text x="30" y="284" fill="#edf0e7" font-size="20" text-anchor="start">Waiting group? The sharing helper skips that recipient.</text></g></svg>

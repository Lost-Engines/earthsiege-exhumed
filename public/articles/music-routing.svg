<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" role="img" aria-labelledby="title desc"><title id="title">Hardware routing and digital percussion</title><desc id="desc">A song supplies timed events and device assignments. The physical synthesis driver and the separate percussion driver feed the audible mix.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10Z" fill="context-stroke"/></marker></defs><rect width="800" height="520" fill="#101b25"/><g font-family="system-ui,sans-serif"><text x="30" y="40" fill="#ebca80" font-size="25" text-anchor="start">From HMP tracks to audible sound</text><rect x="240" y="80" width="320" height="70" rx="5" fill="#1b2a35" stroke="#82c9bd"/><text x="255" y="109" fill="#82c9bd" font-size="20" text-anchor="start">HMP song</text><text x="255" y="135" fill="#a9bbc5" font-size="16" text-anchor="start">Timed events + device assignments</text><path d="M320,150 L205,195" fill="none" stroke="#82c9bd" stroke-width="2" marker-end="url(#arrow)"/><path d="M480,150 L595,195" fill="none" stroke="#82c9bd" stroke-width="2" marker-end="url(#arrow)"/><rect x="40" y="200" width="330" height="75" rx="5" fill="#1b2a35" stroke="#82c9bd"/><text x="55" y="229" fill="#82c9bd" font-size="20" text-anchor="start">Selected physical driver</text><text x="55" y="255" fill="#a9bbc5" font-size="16" text-anchor="start">FM, or an installed MIDI device</text><rect x="430" y="200" width="330" height="75" rx="5" fill="#1b2a35" stroke="#82c9bd"/><text x="445" y="229" fill="#82c9bd" font-size="20" text-anchor="start">Digital percussion driver</text><text x="445" y="255" fill="#a9bbc5" font-size="16" text-anchor="start">Game-supplied sample bank</text><path d="M205,275 L205,315" fill="none" stroke="#82c9bd" stroke-width="2" marker-end="url(#arrow)"/><path d="M595,275 L595,315" fill="none" stroke="#82c9bd" stroke-width="2" marker-end="url(#arrow)"/><rect x="40" y="320" width="330" height="75" rx="5" fill="#1b2a35" stroke="#82c9bd"/><text x="55" y="349" fill="#82c9bd" font-size="20" text-anchor="start">Synthesized sound</text><text x="55" y="375" fill="#a9bbc5" font-size="16" text-anchor="start">Registers or outgoing MIDI bytes</text><rect x="430" y="320" width="330" height="75" rx="5" fill="#1b2a35" stroke="#82c9bd"/><text x="445" y="349" fill="#82c9bd" font-size="20" text-anchor="start">PCM sample playback</text><text x="445" y="375" fill="#a9bbc5" font-size="16" text-anchor="start">Shared digital mixer</text><text x="30" y="450" fill="#a9bbc5" font-size="20" text-anchor="start">Only tracks with a matching destination reach their driver.</text><text x="30" y="485" fill="#82c9bd" font-size="20" text-anchor="start">The normal FM setup installs both left and right paths.</text></g></svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 390" role="img" aria-labelledby="title desc"><title id="title">Input replay and observation</title><desc id="desc">Ordinary frames and dialogs consume the same recording through different paths. Observations are not replay instructions.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10Z" fill="context-stroke"/></marker></defs><rect width="800" height="390" fill="#101b25"/><g font-family="system-ui,sans-serif"><text x="30" y="40" fill="#ebca80" font-size="25" text-anchor="start">A tape records inputs, not finished frames</text><rect x="30" y="85" width="245" height="75" rx="5" fill="#1b2a35" stroke="#82c9bd"/><text x="45" y="114" fill="#82c9bd" font-size="20" text-anchor="start">TAP input records</text><text x="45" y="140" fill="#a9bbc5" font-size="16" text-anchor="start">Keys, mouse, elapsed values</text><path d="M275,120 L345,120" fill="none" stroke="#82c9bd" stroke-width="2" marker-end="url(#arrow)"/><rect x="350" y="85" width="410" height="75" rx="5" fill="#1b2a35" stroke="#82c9bd"/><text x="365" y="114" fill="#82c9bd" font-size="20" text-anchor="start">Original input handling</text><text x="365" y="140" fill="#a9bbc5" font-size="16" text-anchor="start">Some records are consumed inside dialogs</text><path d="M480,160 L210,210" fill="none" stroke="#82c9bd" stroke-width="2" marker-end="url(#arrow)"/><path d="M620,160 L595,210" fill="none" stroke="#82c9bd" stroke-width="2" marker-end="url(#arrow)"/><rect x="40" y="215" width="330" height="70" rx="5" fill="#1b2a35" stroke="#82c9bd"/><text x="55" y="244" fill="#82c9bd" font-size="20" text-anchor="start">Ordinary frame</text><text x="55" y="270" fill="#a9bbc5" font-size="16" text-anchor="start">Simulation, drawing, presentation</text><rect x="430" y="215" width="330" height="70" rx="5" fill="#1b2a35" stroke="#82c9bd"/><text x="445" y="244" fill="#82c9bd" font-size="20" text-anchor="start">Dialog processing</text><text x="445" y="270" fill="#a9bbc5" font-size="16" text-anchor="start">Its own input and display path</text><text x="30" y="340" fill="#82c9bd" font-size="21" text-anchor="start">Read-only observer: state, clocks, video pages and return files</text></g></svg>

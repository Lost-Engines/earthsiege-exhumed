<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" role="img" aria-labelledby="title desc"><title id="title">Orders, contacts and decisions</title><desc id="desc">Related decision layers in the original HERC controllers; this is not a frame-order trace.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10Z" fill="context-stroke"/></marker></defs><rect width="800" height="560" fill="#101b25"/><g font-family="system-ui,sans-serif"><text x="30" y="40" fill="#ebca80" font-size="25" text-anchor="start">How a HERC reaches a decision</text><rect x="40" y="80" width="330" height="75" rx="5" fill="#1b2a35" stroke="#82c9bd"/><text x="55" y="109" fill="#82c9bd" font-size="20" text-anchor="start">Group orders</text><text x="55" y="135" fill="#a9bbc5" font-size="16" text-anchor="start">Patrol, guard, travel, destroy</text><rect x="430" y="80" width="330" height="75" rx="5" fill="#1b2a35" stroke="#82c9bd"/><text x="445" y="109" fill="#82c9bd" font-size="20" text-anchor="start">Perception</text><text x="445" y="135" fill="#a9bbc5" font-size="16" text-anchor="start">Contacts, visibility, shared sightings</text><path d="M205,155 L335,210" fill="none" stroke="#82c9bd" stroke-width="2" marker-end="url(#arrow)"/><path d="M595,155 L465,210" fill="none" stroke="#82c9bd" stroke-width="2" marker-end="url(#arrow)"/><rect x="230" y="215" width="340" height="75" rx="5" fill="#1b2a35" stroke="#82c9bd"/><text x="245" y="244" fill="#82c9bd" font-size="20" text-anchor="start">Target selection</text><text x="245" y="270" fill="#a9bbc5" font-size="16" text-anchor="start">Eligibility, priority class, score</text><path d="M400,290 L400,325" fill="none" stroke="#82c9bd" stroke-width="2" marker-end="url(#arrow)"/><rect x="230" y="330" width="340" height="75" rx="5" fill="#1b2a35" stroke="#82c9bd"/><text x="245" y="359" fill="#82c9bd" font-size="20" text-anchor="start">Combat strategy</text><text x="245" y="385" fill="#a9bbc5" font-size="16" text-anchor="start">Attack, flank, face off, flee</text><path d="M330,405 L205,450" fill="none" stroke="#82c9bd" stroke-width="2" marker-end="url(#arrow)"/><path d="M470,405 L595,450" fill="none" stroke="#82c9bd" stroke-width="2" marker-end="url(#arrow)"/><rect x="40" y="455" width="330" height="75" rx="5" fill="#1b2a35" stroke="#82c9bd"/><text x="55" y="484" fill="#82c9bd" font-size="20" text-anchor="start">Movement requests</text><text x="55" y="510" fill="#a9bbc5" font-size="16" text-anchor="start">Steering and animated locomotion</text><rect x="430" y="455" width="330" height="75" rx="5" fill="#1b2a35" stroke="#82c9bd"/><text x="445" y="484" fill="#82c9bd" font-size="20" text-anchor="start">Weapon controls</text><text x="445" y="510" fill="#a9bbc5" font-size="16" text-anchor="start">Selection, aiming, discharge</text></g></svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 650" role="img" aria-labelledby="title desc"><title id="title">Campaign branch destinations</title><desc id="desc">Each row gives the two outgoing edges of one campaign node. Node zero leads to one or two; node seven leads to victory or failure.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10Z" fill="context-stroke"/></marker></defs><rect width="800" height="650" fill="#101b25"/><g font-family="system-ui,sans-serif"><text x="30" y="40" fill="#ebca80" font-size="25" text-anchor="start">Where the campaign goes next</text><text x="30" y="74" fill="#a9bbc5" font-size="18" text-anchor="start">After the last mission step in each node</text><text x="35" y="118" fill="#edf0e7" font-size="18" text-anchor="start">Completed node</text><text x="265" y="118" fill="#82c9bd" font-size="20" text-anchor="start">Branch 0</text><text x="540" y="118" fill="#ebca80" font-size="20" text-anchor="start">Branch 1</text><rect x="35" y="150" width="140" height="38" rx="5" fill="#1b2a35" stroke="#a9bbc5"/><text x="50" y="179" fill="#a9bbc5" font-size="20" text-anchor="start">0</text><path d="M210,170 L250,170" fill="none" stroke="#82c9bd" stroke-width="2" marker-end="url(#arrow)"/><text x="265" y="176" fill="#82c9bd" font-size="21" text-anchor="start">Node 1</text><path d="M485,170 L525,170" fill="none" stroke="#ebca80" stroke-width="2" marker-end="url(#arrow)"/><text x="540" y="176" fill="#ebca80" font-size="21" text-anchor="start">Node 2</text><rect x="35" y="203" width="140" height="38" rx="5" fill="#1b2a35" stroke="#a9bbc5"/><text x="50" y="232" fill="#a9bbc5" font-size="20" text-anchor="start">1</text><path d="M210,223 L250,223" fill="none" stroke="#82c9bd" stroke-width="2" marker-end="url(#arrow)"/><text x="265" y="229" fill="#82c9bd" font-size="21" text-anchor="start">Node 3</text><path d="M485,223 L525,223" fill="none" stroke="#ebca80" stroke-width="2" marker-end="url(#arrow)"/><text x="540" y="229" fill="#ebca80" font-size="21" text-anchor="start">Node 4</text><rect x="35" y="256" width="140" height="38" rx="5" fill="#1b2a35" stroke="#a9bbc5"/><text x="50" y="285" fill="#a9bbc5" font-size="20" text-anchor="start">2</text><path d="M210,276 L250,276" fill="none" stroke="#82c9bd" stroke-width="2" marker-end="url(#arrow)"/><text x="265" y="282" fill="#82c9bd" font-size="21" text-anchor="start">Node 3</text><path d="M485,276 L525,276" fill="none" stroke="#ebca80" stroke-width="2" marker-end="url(#arrow)"/><text x="540" y="282" fill="#ebca80" font-size="21" text-anchor="start">Failure</text><rect x="35" y="309" width="140" height="38" rx="5" fill="#1b2a35" stroke="#a9bbc5"/><text x="50" y="338" fill="#a9bbc5" font-size="20" text-anchor="start">3</text><path d="M210,329 L250,329" fill="none" stroke="#82c9bd" stroke-width="2" marker-end="url(#arrow)"/><text x="265" y="335" fill="#82c9bd" font-size="21" text-anchor="start">Node 5</text><path d="M485,329 L525,329" fill="none" stroke="#ebca80" stroke-width="2" marker-end="url(#arrow)"/><text x="540" y="335" fill="#ebca80" font-size="21" text-anchor="start">Node 6</text><rect x="35" y="362" width="140" height="38" rx="5" fill="#1b2a35" stroke="#a9bbc5"/><text x="50" y="391" fill="#a9bbc5" font-size="20" text-anchor="start">4</text><path d="M210,382 L250,382" fill="none" stroke="#82c9bd" stroke-width="2" marker-end="url(#arrow)"/><text x="265" y="388" fill="#82c9bd" font-size="21" text-anchor="start">Node 5</text><path d="M485,382 L525,382" fill="none" stroke="#ebca80" stroke-width="2" marker-end="url(#arrow)"/><text x="540" y="388" fill="#ebca80" font-size="21" text-anchor="start">Failure</text><rect x="35" y="415" width="140" height="38" rx="5" fill="#1b2a35" stroke="#a9bbc5"/><text x="50" y="444" fill="#a9bbc5" font-size="20" text-anchor="start">5</text><path d="M210,435 L250,435" fill="none" stroke="#82c9bd" stroke-width="2" marker-end="url(#arrow)"/><text x="265" y="441" fill="#82c9bd" font-size="21" text-anchor="start">Node 7</text><path d="M485,435 L525,435" fill="none" stroke="#ebca80" stroke-width="2" marker-end="url(#arrow)"/><text x="540" y="441" fill="#ebca80" font-size="21" text-anchor="start">Failure</text><rect x="35" y="468" width="140" height="38" rx="5" fill="#1b2a35" stroke="#a9bbc5"/><text x="50" y="497" fill="#a9bbc5" font-size="20" text-anchor="start">6</text><path d="M210,488 L250,488" fill="none" stroke="#82c9bd" stroke-width="2" marker-end="url(#arrow)"/><text x="265" y="494" fill="#82c9bd" font-size="21" text-anchor="start">Node 7</text><path d="M485,488 L525,488" fill="none" stroke="#ebca80" stroke-width="2" marker-end="url(#arrow)"/><text x="540" y="494" fill="#ebca80" font-size="21" text-anchor="start">Failure</text><rect x="35" y="521" width="140" height="38" rx="5" fill="#1b2a35" stroke="#a9bbc5"/><text x="50" y="550" fill="#a9bbc5" font-size="20" text-anchor="start">7</text><path d="M210,541 L250,541" fill="none" stroke="#82c9bd" stroke-width="2" marker-end="url(#arrow)"/><text x="265" y="547" fill="#82c9bd" font-size="21" text-anchor="start">Victory</text><path d="M485,541 L525,541" fill="none" stroke="#ebca80" stroke-width="2" marker-end="url(#arrow)"/><text x="540" y="547" fill="#ebca80" font-size="21" text-anchor="start">Failure</text><text x="30" y="610" fill="#a9bbc5" font-size="17" text-anchor="start">Branch 0: grade at or below threshold. Branch 1: grade above threshold.</text></g></svg>

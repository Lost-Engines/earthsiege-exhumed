<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" role="img" aria-labelledby="title desc"><title id="title">Local avoidance and formation offset</title><desc id="desc">Schematic top-down examples, not a captured trajectory. Avoidance casts two forward diagonal probes; formation following rotates an offset with the leader.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10Z" fill="context-stroke"/></marker></defs><rect width="800" height="470" fill="#101b25"/><g font-family="system-ui,sans-serif"><text x="30" y="40" fill="#ebca80" font-size="24" text-anchor="start">Following the route and avoiding what is in the way</text><text x="50" y="87" fill="#82c9bd" font-size="22" text-anchor="start">Immediate avoidance</text><text x="440" y="87" fill="#ebca80" font-size="22" text-anchor="start">Formation following</text><rect x="145" y="320" width="90" height="70" rx="5" fill="#1b2a35" stroke="#82c9bd"/><text x="160" y="349" fill="#82c9bd" font-size="20" text-anchor="start">HERC</text><path d="M155,320 L75,155" fill="none" stroke="#82c9bd" stroke-width="2" marker-end="url(#arrow)"/><path d="M225,320 L305,155" fill="none" stroke="#82c9bd" stroke-width="2" marker-end="url(#arrow)"/><rect x="235" y="130" width="115" height="60" rx="5" fill="#1b2a35" stroke="#a9bbc5"/><text x="250" y="159" fill="#a9bbc5" font-size="20" text-anchor="start">Scenery</text><text x="45" y="425" fill="#a9bbc5" font-size="18" text-anchor="start">Two diagonal clearance probes</text><rect x="545" y="145" width="120" height="65" rx="5" fill="#1b2a35" stroke="#ebca80"/><text x="560" y="174" fill="#ebca80" font-size="20" text-anchor="start">Leader</text><rect x="440" y="315" width="130" height="65" rx="5" fill="#1b2a35" stroke="#82c9bd"/><text x="455" y="344" fill="#82c9bd" font-size="20" text-anchor="start">Follower</text><circle cx="480" cy="220" r="7" fill="#ebca80"/><path d="M605,210 L480,220" fill="none" stroke="#ebca80" stroke-width="2" stroke-dasharray="6 5"/><path d="M505,315 L480,231" fill="none" stroke="#82c9bd" stroke-width="2" marker-end="url(#arrow)"/><text x="437" y="257" fill="#ebca80" font-size="18" text-anchor="start">Assigned offset</text><text x="437" y="285" fill="#a9bbc5" font-size="17" text-anchor="start">rotates with leader</text><text x="437" y="425" fill="#a9bbc5" font-size="16" text-anchor="start">Large heading error can request reverse</text></g></svg>

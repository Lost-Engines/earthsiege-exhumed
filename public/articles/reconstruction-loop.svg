<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" role="img" aria-labelledby="title desc"><title id="title">Controlled original versus native comparison</title><desc id="desc">Identical meaningful inputs feed independent executions. Outputs and resulting state are compared afterward.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10Z" fill="context-stroke"/></marker></defs><rect width="800" height="420" fill="#101b25"/><g font-family="system-ui,sans-serif"><text x="30" y="40" fill="#ebca80" font-size="25" text-anchor="start">Ask the original a controlled question</text><rect x="245" y="80" width="310" height="65" rx="5" fill="#1b2a35" stroke="#82c9bd"/><text x="260" y="109" fill="#82c9bd" font-size="20" text-anchor="start">Known starting state</text><text x="260" y="135" fill="#a9bbc5" font-size="16" text-anchor="start">Inputs, objects and boundary values</text><path d="M320,145 L210,190" fill="none" stroke="#82c9bd" stroke-width="2" marker-end="url(#arrow)"/><path d="M480,145 L590,190" fill="none" stroke="#82c9bd" stroke-width="2" marker-end="url(#arrow)"/><rect x="45" y="195" width="330" height="75" rx="5" fill="#1b2a35" stroke="#82c9bd"/><text x="60" y="224" fill="#82c9bd" font-size="20" text-anchor="start">Original x86 routine</text><text x="60" y="250" fill="#a9bbc5" font-size="16" text-anchor="start">Execute retained instructions</text><rect x="425" y="195" width="330" height="75" rx="5" fill="#1b2a35" stroke="#82c9bd"/><text x="440" y="224" fill="#82c9bd" font-size="20" text-anchor="start">Independent replacement</text><text x="440" y="250" fill="#a9bbc5" font-size="16" text-anchor="start">Calculate its own answer</text><path d="M210,270 L325,310" fill="none" stroke="#82c9bd" stroke-width="2" marker-end="url(#arrow)"/><path d="M590,270 L475,310" fill="none" stroke="#82c9bd" stroke-width="2" marker-end="url(#arrow)"/><rect x="190" y="315" width="420" height="75" rx="5" fill="#1b2a35" stroke="#82c9bd"/><text x="205" y="344" fill="#82c9bd" font-size="20" text-anchor="start">Compare outputs and remaining state</text><text x="205" y="370" fill="#a9bbc5" font-size="16" text-anchor="start">Result, mutations, callbacks, RNG</text></g></svg>
